<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata Editor</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0a72e8;
    --dirty: #fff3cd;
    --error: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --fg: #f5f5f7;
      --muted: #98989d;
      --border: #3a3a3c;
      --accent: #3d9bff;
      --dirty: #4a3d1a;
      --error: #ff6961;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --fg: #f5f5f7;
    --muted: #98989d;
    --border: #3a3a3c;
    --accent: #3d9bff;
    --dirty: #4a3d1a;
    --error: #ff6961;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  #path { flex: 1; min-width: 240px; }

  input[type="text"] {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    padding: 20px;
    align-items: start;
  }
  aside img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .filename { color: var(--muted); word-break: break-all; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 12px;
    background: var(--bg);
  }
  .spacer { flex: 1; }
  .status { color: var(--muted); }
  .status.error { color: var(--error); }

  .group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .group h2 {
    margin: 4px 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .row {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 12px;
    align-items: center;
    padding: 3px 0;
  }
  .row input { width: 100%; }
  .row.dirty input { background: var(--dirty); }
  .row input[readonly] { color: var(--muted); background: transparent; border-color: transparent; }
  .tag {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .muted { color: var(--muted); }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <h1>Metadata Editor</h1>
  <input id="path" type="text" placeholder="/path/to/picture.jpg" spellcheck="false">
  <button id="open">Open</button>
  <button id="choose">Choose picture…</button>
</header>

<p id="empty" class="muted" style="padding: 20px;">Choose a picture to see its metadata.</p>

<main id="main" hidden>
  <aside>
    <img id="preview" alt="Preview (not available for this format)">
    <p id="fileName" class="filename"></p>
  </aside>
  <section>
    <div class="toolbar">
      <label><input type="checkbox" id="hideEmpty" checked> Hide empty fields</label>
      <span id="status" class="status"></span>
      <span class="spacer"></span>
      <button id="revert" disabled>Revert</button>
      <button id="save" class="primary" disabled>Save</button>
    </div>
    <div id="groups"></div>
  </section>
</main>

<script>
  const $ = (selector) => document.querySelector(selector);
  let state = null; // { path, fields: [{ key, group, tag, type, readonly, original, current, row }] }

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  const toText = (value) => (Array.isArray(value) ? value.join(', ') : value == null ? '' : String(value));
  const parseList = (text) => text.split(',').map((item) => item.trim()).filter(Boolean);
  const isDirty = (field) => field.current !== field.original;
  const isEmpty = (field) => field.original.trim() === '';
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;

  async function api(url, body) {
    const response = await fetch(url, body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : {});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
  }

  function setStatus(message, isError = false) {
    const status = $('#status');
    status.textContent = message;
    status.classList.toggle('error', isError);
  }

  function setState(data) {
    state = {
      path: data.path,
      fields: data.fields.map((field) => {
        const text = toText(field.value);
        return { ...field, original: text, current: text, row: null };
      }),
    };
    $('#path').value = data.path;
    $('#fileName').textContent = data.fileName;
    $('#preview').src = `/api/preview?path=${encodeURIComponent(data.path)}&t=${Date.now()}`;
    $('#main').hidden = false;
    $('#empty').hidden = true;
    render();
  }

  function render() {
    const hideEmpty = $('#hideEmpty').checked;
    const container = $('#groups');
    const byGroup = new Map();

    for (const field of state.fields) {
      // Edited fields stay visible so a change is never hidden from the user.
      if (hideEmpty && isEmpty(field) && !isDirty(field)) continue;
      if (!byGroup.has(field.group)) byGroup.set(field.group, []);
      byGroup.get(field.group).push(field);
    }

    container.replaceChildren();
    for (const [group, fields] of byGroup) {
      const section = el('section', { className: 'group' }, el('h2', { textContent: group }));
      for (const field of fields) section.append(renderRow(field));
      container.append(section);
    }
    if (byGroup.size === 0) {
      container.append(el('p', { className: 'muted', textContent: 'No fields to show. Untick "Hide empty fields" to see all.' }));
    }
    updateDirty();
  }

  function renderRow(field) {
    const input = el('input', {
      type: 'text',
      value: field.current,
      readOnly: field.readonly,
      placeholder: field.type === 'list' ? 'Separate values with commas' : '',
      title: field.key,
    });
    input.addEventListener('input', () => {
      field.current = input.value;
      updateDirty();
    });
    field.row = el('div', { className: 'row' }, el('span', { className: 'tag', textContent: field.tag, title: field.key }), input);
    return field.row;
  }

  function updateDirty() {
    const changed = state.fields.filter(isDirty);
    for (const field of state.fields) field.row?.classList.toggle('dirty', isDirty(field));
    $('#save').disabled = changed.length === 0;
    $('#revert').disabled = changed.length === 0;
    setStatus(changed.length ? `${plural(changed.length, 'unsaved change')}` : '');
  }

  async function open(path) {
    if (!path) return setStatus('Enter a picture path or choose one.', true);
    if (state?.fields.some(isDirty) && !confirm('Discard unsaved changes?')) return;
    try {
      setState(await api(`/api/file?path=${encodeURIComponent(path)}`));
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  async function choose() {
    try {
      const { path } = await api('/api/choose', {});
      if (path) await open(path);
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  async function save() {
    const changes = state.fields.filter(isDirty).map((field) => ({
      key: field.key,
      value: field.type === 'list' ? parseList(field.current) : field.current,
    }));
    if (changes.length === 0) return;

    try {
      const data = await api('/api/save', { path: state.path, changes });
      setState(data);
      setStatus(`Saved ${plural(changes.length, 'field')}.`);
    } catch (err) {
      setStatus(`Save failed: ${err.message}`, true);
    }
  }

  function revert() {
    for (const field of state.fields) field.current = field.original;
    render();
  }

  $('#open').addEventListener('click', () => open($('#path').value.trim()));
  $('#path').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') open($('#path').value.trim());
  });
  $('#choose').addEventListener('click', choose);
  $('#hideEmpty').addEventListener('change', render);
  $('#save').addEventListener('click', save);
  $('#revert').addEventListener('click', revert);
  document.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === 's') {
      event.preventDefault();
      if (state) save();
    }
  });
  window.addEventListener('beforeunload', (event) => {
    if (state?.fields.some(isDirty)) event.preventDefault();
  });
</script>
</body>
</html>
