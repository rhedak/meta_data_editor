<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a72e8'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='22' font-weight='700' text-anchor='middle' fill='%23ffffff'%3Em%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0a72e8;
    --dirty: #fff3cd;
    --error: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --fg: #f5f5f7;
      --muted: #98989d;
      --border: #3a3a3c;
      --accent: #3d9bff;
      --dirty: #4a3d1a;
      --error: #ff6961;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --fg: #f5f5f7;
    --muted: #98989d;
    --border: #3a3a3c;
    --accent: #3d9bff;
    --dirty: #4a3d1a;
    --error: #ff6961;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  #path { flex: 1; min-width: 240px; }

  input[type="text"] {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    padding: 20px;
    align-items: start;
  }
  aside img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .cover-controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .filename { color: var(--muted); word-break: break-all; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 12px;
    background: var(--bg);
  }
  .spacer { flex: 1; }
  .status { color: var(--muted); }
  .status.error { color: var(--error); }

  .group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .group h2 {
    margin: 4px 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .row {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 12px;
    align-items: center;
    padding: 3px 0;
  }
  .row input { width: 100%; }
  .row.dirty input { background: var(--dirty); }
  .row input[readonly] { color: var(--muted); background: transparent; border-color: transparent; }
  .tag {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .muted { color: var(--muted); }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <h1>Metadata Editor</h1>
  <input id="path" type="text" placeholder="/path/to/file" spellcheck="false">
  <button id="open">Open</button>
  <button id="choose">Choose file…</button>
</header>

<p id="empty" class="muted" style="padding: 20px;">Choose a picture or audio file to see its metadata.</p>

<main id="main" hidden>
  <aside>
    <img id="preview" alt="Preview">
    <p id="coverNote" class="muted" hidden></p>
    <div id="coverControls" class="cover-controls" hidden>
      <button id="chooseCover">Add cover…</button>
      <button id="removeCover">Remove cover</button>
    </div>
    <p id="fileName" class="filename"></p>
  </aside>
  <section>
    <div class="toolbar">
      <label><input type="checkbox" id="hideEmpty" checked> Hide empty fields</label>
      <span id="status" class="status"></span>
      <span class="spacer"></span>
      <button id="saveClean" title="Save a copy with all metadata removed. Your saved file is not changed.">Save clean copy</button>
      <button id="revert" disabled>Revert</button>
      <button id="saveAs" title="Save a copy with your edits to a new file, chosen in the save dialog">Save as…</button>
      <button id="save" class="primary" disabled>Save</button>
    </div>
    <div id="groups"></div>
  </section>
</main>

<script>
  const $ = (selector) => document.querySelector(selector);
  // state.cover: undefined = unchanged, 'remove' = remove on save, { image } = replace with that file on save
  let state = null; // { path, kind, hasCover, cover, fields: [{ key, group, tag, type, readonly, original, current, row }] }

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  const toText = (value) => (Array.isArray(value) ? value.join(', ') : value == null ? '' : String(value));
  const parseList = (text) => text.split(',').map((item) => item.trim()).filter(Boolean);
  const isDirty = (field) => field.current !== field.original;
  const isEmpty = (field) => field.original.trim() === '';
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;

  async function api(url, body) {
    const response = await fetch(url, body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : {});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
  }

  function setStatus(message, isError = false) {
    const status = $('#status');
    status.textContent = message;
    status.classList.toggle('error', isError);
  }

  function unsavedCount() {
    return state.fields.filter(isDirty).length + (state.cover === undefined ? 0 : 1);
  }

  function pendingChanges() {
    return state.fields.filter(isDirty).map((field) => ({
      key: field.key,
      value: field.type === 'list' ? parseList(field.current) : field.current,
    }));
  }

  // Edits sent to the server. A missing cover key means "leave the cover alone".
  function pendingBody() {
    return { changes: pendingChanges(), cover: state.cover === 'remove' ? null : state.cover };
  }

  function setState(data) {
    state = {
      path: data.path,
      kind: data.kind,
      hasCover: data.hasCover,
      cover: undefined,
      fields: data.fields.map((field) => {
        const text = toText(field.value);
        return { ...field, original: text, current: text, row: null };
      }),
    };
    $('#path').value = data.path;
    $('#fileName').textContent = data.fileName;
    $('#main').hidden = false;
    $('#empty').hidden = true;
    render();
    renderPreview();
  }

  function render() {
    const hideEmpty = $('#hideEmpty').checked;
    const container = $('#groups');
    const byGroup = new Map();

    for (const field of state.fields) {
      // Edited fields stay visible so a change is never hidden from the user.
      if (hideEmpty && isEmpty(field) && !isDirty(field)) continue;
      if (!byGroup.has(field.group)) byGroup.set(field.group, []);
      byGroup.get(field.group).push(field);
    }

    container.replaceChildren();
    for (const [group, fields] of byGroup) {
      const section = el('section', { className: 'group' }, el('h2', { textContent: group }));
      for (const field of fields) section.append(renderRow(field));
      container.append(section);
    }
    if (byGroup.size === 0) {
      container.append(el('p', { className: 'muted', textContent: 'No fields to show. Untick "Hide empty fields" to see all.' }));
    }
    updateDirty();
  }

  function renderRow(field) {
    const input = el('input', {
      type: 'text',
      value: field.current,
      readOnly: field.readonly,
      placeholder: field.type === 'list' ? 'Separate values with commas' : '',
      title: field.key,
    });
    input.addEventListener('input', () => {
      field.current = input.value;
      updateDirty();
    });
    field.row = el('div', { className: 'row' }, el('span', { className: 'tag', textContent: field.tag, title: field.key }), input);
    return field.row;
  }

  // Shows the cover area for audio files and what the cover will be after Save.
  function renderPreview() {
    const img = $('#preview');
    const note = $('#coverNote');
    const audio = state.kind === 'audio';
    const hasCoverNow = state.cover === 'remove' ? false : state.cover ? true : state.hasCover;

    $('#coverControls').hidden = !audio;
    $('#chooseCover').textContent = hasCoverNow ? 'Replace cover…' : 'Add cover…';
    $('#removeCover').disabled = !hasCoverNow;

    let src = '';
    let text = '';
    if (!audio) {
      src = `/api/preview?path=${encodeURIComponent(state.path)}`;
    } else if (state.cover === 'remove') {
      text = 'No cover image. It will be removed on Save.';
    } else if (state.cover) {
      src = `/api/preview?path=${encodeURIComponent(state.cover.image)}`;
      text = 'New cover. It will be applied on Save.';
    } else if (state.hasCover) {
      src = `/api/cover?path=${encodeURIComponent(state.path)}`;
    } else {
      text = 'No cover image.';
    }

    img.onerror = () => {
      img.hidden = true;
      note.textContent = 'Preview not available for this image.';
      note.hidden = false;
    };
    img.hidden = !src;
    if (src) img.src = `${src}&t=${Date.now()}`;
    note.textContent = text;
    note.hidden = !text;
  }

  function updateDirty() {
    const count = unsavedCount();
    for (const field of state.fields) field.row?.classList.toggle('dirty', isDirty(field));
    $('#save').disabled = count === 0;
    $('#revert').disabled = count === 0;
    // The clean copy is made from the saved file, so wait until edits are saved.
    $('#saveClean').disabled = count > 0;
    setStatus(count ? plural(count, 'unsaved change') : '');
  }

  async function open(path) {
    if (!path) return setStatus('Enter a file path or choose one.', true);
    if (state && unsavedCount() > 0 && !confirm('Discard unsaved changes?')) return;
    try {
      setState(await api(`/api/file?path=${encodeURIComponent(path)}`));
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  async function choose() {
    try {
      const { path } = await api('/api/choose', {});
      if (path) await open(path);
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  async function chooseCover() {
    try {
      const { path } = await api('/api/choose', { prompt: 'Choose a cover image' });
      if (!path) return;
      state.cover = { image: path };
      renderPreview();
      updateDirty();
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  function removeCover() {
    state.cover = state.hasCover ? 'remove' : undefined;
    renderPreview();
    updateDirty();
  }

  async function save() {
    if (unsavedCount() === 0) return;
    const parts = [];
    const fieldCount = pendingChanges().length;
    if (fieldCount) parts.push(plural(fieldCount, 'field'));
    if (state.cover !== undefined) parts.push('cover image');

    try {
      const data = await api('/api/save', { path: state.path, ...pendingBody() });
      setState(data);
      setStatus(`Saved ${parts.join(' and ')}.`);
    } catch (err) {
      setStatus(`Save failed: ${err.message}`, true);
    }
  }

  async function saveClean() {
    try {
      const { path } = await api('/api/save-clean', { path: state.path });
      setStatus(`Clean copy saved as ${path}`);
    } catch (err) {
      setStatus(`Clean copy failed: ${err.message}`, true);
    }
  }

  // Writes the current edits (saved or not) to a file chosen in the OS save dialog.
  // The new file becomes the open file; the original is left as it was.
  async function saveAs() {
    try {
      const data = await api('/api/save-as', { path: state.path, ...pendingBody() });
      if (!data.path) return; // dialog cancelled
      setState(data);
      setStatus(`Saved as ${data.path}`);
    } catch (err) {
      setStatus(`Save as failed: ${err.message}`, true);
    }
  }

  function revert() {
    state.cover = undefined;
    for (const field of state.fields) field.current = field.original;
    render();
    renderPreview();
  }

  $('#open').addEventListener('click', () => open($('#path').value.trim()));
  $('#path').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') open($('#path').value.trim());
  });
  $('#choose').addEventListener('click', choose);
  $('#chooseCover').addEventListener('click', chooseCover);
  $('#removeCover').addEventListener('click', removeCover);
  $('#hideEmpty').addEventListener('change', render);
  $('#save').addEventListener('click', save);
  $('#saveClean').addEventListener('click', saveClean);
  $('#saveAs').addEventListener('click', saveAs);
  $('#revert').addEventListener('click', revert);
  document.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === 's') {
      event.preventDefault();
      if (state) save();
    }
  });
  window.addEventListener('beforeunload', (event) => {
    if (state && unsavedCount() > 0) event.preventDefault();
  });
</script>
</body>
</html>
